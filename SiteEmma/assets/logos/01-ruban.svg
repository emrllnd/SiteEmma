<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EMMA">
  <title>EMMA</title>
  <defs>
    <linearGradient id="blush" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe1ea"/>
      <stop offset=".55" stop-color="#fbbccd"/>
      <stop offset="1" stop-color="#f594b0"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f594b0"/>
      <stop offset="1" stop-color="#d94677"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#7c2d4f" flood-opacity=".22"/>
    </filter>
  </defs>

  <!-- Sticker : bord blanc + fond rose poudré -->
  <g filter="url(#shadow)">
    <rect x="5" y="9" width="52" height="51" rx="17" fill="#fff"/>
  </g>
  <rect x="8" y="12" width="46" height="45" rx="14.5" fill="url(#blush)"/>
  <!-- reflet satiné -->
  <ellipse cx="21" cy="20" rx="11" ry="5" fill="#fff" opacity=".45" transform="rotate(-18 21 20)"/>

  <!-- Le E, tracé souple comme un ruban -->
  <path d="M41 25.5 C37.5 21 27 21 26.3 28 C25.8 32.2 29.5 34.6 34 34.6 C27.8 34.6 23.4 37.4 24.6 42.4 C26.2 49.2 37.6 49.2 42 44.2"
        fill="none" stroke="#7c2d4f" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Étincelle couleur crème -->
  <path d="M46.5 33 L47.6 36.4 L51 37.5 L47.6 38.6 L46.5 42 L45.4 38.6 L42 37.5 L45.4 36.4 Z" fill="#fff" opacity=".95"/>
  <!-- Petite touche matcha -->
  <circle cx="16.5" cy="47" r="2.4" fill="#a9c98a" stroke="#fff" stroke-width="1.2"/>

  <!-- Nœud satiné sur le coin -->
  <g stroke="#fff" stroke-width="1.4" stroke-linejoin="round">
    <path d="M47 11.5 L43.2 20.5 L46.2 19.6 L47.6 22.4 L49 13 Z" fill="url(#ribbon)"/>
    <path d="M50.2 11.5 L54.4 20 L51.4 19.4 L50.2 22.2 L48.6 13 Z" fill="url(#ribbon)"/>
    <path d="M48.6 11.2 C43.5 5 37.4 7.2 39 12.4 C40.2 16.2 45 14.8 48.6 11.2 Z" fill="url(#ribbon)"/>
    <path d="M48.6 11.2 C53.7 5 59.8 7.2 58.2 12.4 C57 16.2 52.2 14.8 48.6 11.2 Z" fill="url(#ribbon)"/>
    <circle cx="48.6" cy="11.4" r="2.6" fill="#ec6a91"/>
  </g>
  <path d="M41.6 9.6 C43.4 8.6 45.6 9.6 46.6 10.8" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round" opacity=".7"/>
</svg>
